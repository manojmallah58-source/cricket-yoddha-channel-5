<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cric Yoddha - Live</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #070b14; --card: #111827; --text: #f3f4f6; --border: rgba(255, 255, 255, 0.1); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow-x: hidden; }

        /* --- AUTH SCREEN --- */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--card); width: 100%; max-width: 400px; padding: 30px; border-radius: 30px; border: 1px solid var(--border); text-align: center; }
        
        .btn-google { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; margin-bottom: 20px; }
        
        .separator { display: flex; align-items: center; color: #4b5563; font-size: 12px; margin-bottom: 20px; }
        .separator::before, .separator::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 10px; }
        
        input { width: 100%; padding: 15px; margin-bottom: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 15px; color: #fff; outline: none; }
        .btn-auth { width: 100%; padding: 16px; background: var(--primary); border: none; border-radius: 15px; color: #fff; font-weight: 700; cursor: pointer; }
        
        #error-box { background: rgba(239, 68, 68, 0.1); color: #ef4444; font-size: 12px; padding: 10px; border-radius: 10px; margin-bottom: 15px; display: none; }

        /* --- EXIT POPUP (As per Screenshot) --- */
        #exit-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(5px); }
        .exit-box { background: #1e293b; width: 85%; max-width: 320px; padding: 35px 25px; border-radius: 30px; text-align: center; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .exit-box h3 { font-size: 22px; margin-bottom: 10px; color: #fff; }
        .exit-box p { font-size: 14px; color: #9ca3af; margin-bottom: 30px; }
        .exit-btns { display: flex; gap: 15px; }
        .btn-exit { flex: 1; padding: 14px; border-radius: 15px; font-weight: 700; cursor: pointer; border: none; font-size: 16px; text-transform: uppercase; }
        .btn-yes { background: #ef4444; color: white; }
        .btn-no { background: #334155; color: white; }

        /* --- DASHBOARD --- */
        #main-app { display: none; }
        .header { height: 65px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        #player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; margin-bottom: 25px; display: none; border: 1px solid var(--border); }
        iframe { width: 100%; height: 100%; border: none; }
        .channel-item { background: var(--card); border-radius: 20px; padding: 12px; display: flex; align-items: center; margin-bottom: 12px; border: 1px solid var(--border); cursor: pointer; }
        .channel-item img { width: 55px; height: 55px; border-radius: 15px; margin-right: 15px; object-fit: cover; }
    </style>
</head>
<body>

    <div id="exit-overlay">
        <div class="exit-box">
            <h3>Exit App?</h3>
            <p>Are you sure you want to close the application?</p>
            <div class="exit-btns">
                <button class="btn-exit btn-yes" onclick="confirmExit()">YES</button>
                <button class="btn-exit btn-no" onclick="closeExit()">NO</button>
            </div>
        </div>
    </div>

    <div id="auth-screen">
        <div class="auth-card">
            <h2 id="auth-title">Welcome back</h2>
            <p id="auth-desc" style="font-size: 13px; color:#94a3b8; margin-bottom:20px;">Sign in to continue</p>
            
            <button class="btn-google" onclick="googleSignIn()">
                <img src="https://img.icons8.com/color/24/000000/google-logo.png"/> Sign in with Google
            </button>
            
            <div class="separator">OR</div>
            <div id="error-box"></div>
            
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            
            <button class="btn-auth" id="main-btn" onclick="handleAuth()">SIGN IN</button>
            
            <p style="margin-top:20px; font-size:13px; color:#94a3b8;">
                Don't have an account? <span onclick="toggleMode()" id="toggle-link" style="color:var(--primary); cursor:pointer; font-weight:600;">Sign Up</span>
            </p>
        </div>
    </div>

    <div id="main-app">
        <header class="header">
            <div style="font-weight:700; font-size:18px;">CRIC <span style="color:var(--primary)">YODDHA</span></div>
            <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#64748b; cursor:pointer;"></i>
        </header>
        <div class="container">
            <div id="player-box"><iframe id="video-frame" src="" allowfullscreen allow="autoplay"></iframe></div>
            <div id="channel-list"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC6a6kH-_7jFTEEIhMTwEOLKMLj7qmtLgQ",
            authDomain: "cric-yoddha.firebaseapp.com",
            databaseURL: "https://cric-yoddha-default-rtdb.firebaseio.com",
            projectId: "cric-yoddha",
            storageBucket: "cric-yoddha.firebasestorage.app",
            messagingSenderId: "340220638066",
            appId: "1:340220638066:web:1360dc2c34e3b8b7a263eb"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const provider = new firebase.auth.GoogleAuthProvider();

        let mode = "signin";

        function toggleMode() {
            mode = (mode === "signin") ? "signup" : "signin";
            document.getElementById('auth-title').innerText = mode === "signin" ? "Welcome back" : "Create Account";
            document.getElementById('main-btn').innerText = mode === "signin" ? "SIGN IN" : "SIGN UP";
            document.getElementById('toggle-link').innerText = mode === "signin" ? "Sign Up" : "Sign In";
            document.getElementById('error-box').style.display = 'none';
        }

        async function handleAuth() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            if(!e || !p) return;

            if(mode === "signin") {
                auth.signInWithEmailAndPassword(e, p).catch(err => {
                    if(err.code === "auth/user-not-found") showError("Account not found! Please Sign Up first.");
                    else showError("Invalid email or password.");
                });
            } else {
                auth.createUserWithEmailAndPassword(e, p).catch(err => showError(err.message));
            }
        }

        function googleSignIn() { auth.signInWithPopup(provider).catch(err => showError(err.message)); }
        function showError(m) { const b = document.getElementById('error-box'); b.innerText = m; b.style.display = 'block'; }
        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                loadChannels();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        function loadChannels() {
            db.ref('channels').on('value', snap => {
                const list = document.getElementById('channel-list');
                list.innerHTML = "";
                snap.forEach(child => {
                    const d = child.val();
                    list.innerHTML += `<div class="channel-item" onclick="play('${d.url}')">
                        <img src="${d.logo}">
                        <div><b>${d.name}</b><br><small style="color:#94a3b8">${d.title}</small></div>
                    </div>`;
                });
            });
        }

        function play(url) {
            document.getElementById('video-frame').src = url;
            document.getElementById('player-box').style.display = 'block';
            window.scrollTo(0,0);
        }

        // EXIT LOGIC
        window.addEventListener('popstate', function() {
            document.getElementById('exit-overlay').style.display = 'flex';
            history.pushState(null, null, window.location.pathname);
        });
        history.pushState(null, null, window.location.pathname);

        function closeExit() { document.getElementById('exit-overlay').style.display = 'none'; }
        
        function confirmExit() {
            // Android WebView Exit Command
            if (navigator.app) { navigator.app.exitApp(); } 
            else if (navigator.device) { navigator.device.exitApp(); } 
            else { window.close(); }
        }
    </script>
</body>
</html>
